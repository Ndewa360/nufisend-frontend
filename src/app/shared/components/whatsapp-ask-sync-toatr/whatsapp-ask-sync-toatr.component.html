<div class="w-full max-w-sm bg-white dark:bg-gray-800 dark:border-gray-700">
    <div class="flex items-center justify-between mb-1 text-sm text-gray-700 dark:text-gray-400">
        <span>Synchronisation WhatsApp en cours...</span>
        <span *ngIf="percent > 0">{{ percent }}%</span>
    </div>
    <mat-progress-bar
        [mode]="percent > 0 ? 'determinate' : 'indeterminate'"
        [value]="percent">
    </mat-progress-bar>
</div>
