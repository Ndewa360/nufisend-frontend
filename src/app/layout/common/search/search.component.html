<ng-container *ngIf="appearance === 'bar'">
    <button mat-icon-button *ngIf="!opened" (click)="open()">
        <mat-icon [svgIcon]="'heroicons_outline:search'"></mat-icon>
    </button>
    <div class="absolute inset-0 flex items-center shrink-0 z-99 bg-card px-4" *ngIf="opened" @slideInTop @slideOutTop>
        <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:search'"></mat-icon>
        <input
            class="w-full ml-4 mr-6 text-lg leading-none bg-transparent border-0 outline-none placeholder-secondary"
            [formControl]="searchControl"
            [matAutocomplete]="matAutocomplete"
            [placeholder]="'Rechercher contacts, groupes, templates...'"
            (keydown)="onKeydown($event)"
            #barSearchInput>
        <button class="shrink-0" mat-icon-button (click)="close()">
            <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>
    <mat-autocomplete
        class="max-h-128 sm:px-2 rounded-2xl"
        [autoSelectActiveOption]="true"
        [disableRipple]="true"
        #matAutocomplete="matAutocomplete">
        <ng-container *ngFor="let resultSet of (resultSets || []); trackBy: trackByFn">
            <mat-optgroup [label]="resultSet.label">
                <ng-container *ngFor="let result of resultSet.results; trackBy: trackByFn">
                    <mat-option
                        class="group relative mb-1 py-0 px-6 text-md rounded-md hover:bg-gray-100 dark:hover:bg-hover"
                        [value]="result.label"
                        (click)="navigateTo(result)">
                        <div class="flex items-center">
                            <mat-icon class="icon-size-5 mr-3 text-secondary" [svgIcon]="result.icon"></mat-icon>
                            <span class="font-medium">{{ result.label }}</span>
                            <span class="ml-2 text-sm text-secondary truncate" *ngIf="result.description">— {{ result.description }}</span>
                        </div>
                    </mat-option>
                </ng-container>
            </mat-optgroup>
        </ng-container>
        <mat-option
            class="py-4 text-center text-secondary"
            *ngIf="(resultSets || []).length === 0 && searchControl.value?.length >= 2"
            [disabled]="true">
            Aucun résultat pour "{{ searchControl.value }}"
        </mat-option>
    </mat-autocomplete>
</ng-container>
