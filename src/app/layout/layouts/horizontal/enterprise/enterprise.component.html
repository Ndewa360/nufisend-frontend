<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<ng-container *ngIf="isScreenSmall">
    <fuse-vertical-navigation
        class="dark bg-green-800 print:hidden"
        [mode]="'over'"
        [name]="'mainNavigation'"
        [navigation]="navigation?.default"
        [opened]="false">
        <ng-container fuseVerticalNavigationContentHeader>
            <div class="flex items-center h-20 pt-6 px-8">
                <img
                    class="w-8"
                    src="assets/images/logo/nufisend_n-nobg.png"
                    alt="NufiSend">
                <span class="ml-2 text-base font-bold text-white">NufiSend</span>
            </div>
        </ng-container>
    </fuse-vertical-navigation>
</ng-container>

<!-- Wrapper -->
<div class="flex flex-col flex-auto items-center w-full min-w-0 bg-gray-200 dark:bg-card">

    <!-- Header -->
    <div class="relative flex flex-col flex-0 justify-center w-full h-16 sm:h-20 md:h-36 overflow-hidden z-49 shadow dark:shadow-none print:hidden">
        <!-- Top bar -->
        <!-- <div class="relative dark flex flex-auto justify-center w-full px-4 md:px-8 bg-gray-800 dark:bg-gray-900"> -->
        <div class="relative dark flex flex-auto justify-center w-full px-4 md:px-8 bg-green-800 dark:bg-gray-900">
            <div class="flex items-center w-full max-w-360 h-16 sm:h-20">
                <!-- Logo -->
                <ng-container *ngIf="!isScreenSmall">
                    <div class="flex items-center">
                        <img
                            class="w-28"
                            src="assets/images/logo/nufisend-logo-white.png"
                            alt="NufiSend">
                    </div>
                </ng-container>
                <!-- Navigation toggle button -->
                <ng-container *ngIf="isScreenSmall">
                    <button
                        mat-icon-button
                        class="text-white"
                        (click)="toggleNavigation('mainNavigation')">
                        <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
                    </button>
                </ng-container>
                <!-- Components -->
                <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
                    <search [appearance]="'bar'"></search>
                    <notifications></notifications>
                    <user></user>
                    <span class="capitalize text-xl align-middle">{{user?.firstName}} {{user?.lastName}}</span>
                </div>
            </div>
        </div>
        <!-- Bottom bar -->
        <ng-container *ngIf="!isScreenSmall">
            <nav  #stickyMenu class="w-full top-0 drop-shadow" [class.fixed]="fixedMenu">
                <div class="flex flex-auto justify-center px-4 md:px-8 bg-card dark:bg-gray-700 ">
                    <div class="relative flex items-center w-full max-w-360 h-16">
                        <fuse-horizontal-navigation
                            class="-mx-4"
                            [name]="'mainNavigation'"
                            [navigation]="navigation?.horizontal"></fuse-horizontal-navigation>
                    </div>
                </div>
            </nav>
            
        </ng-container>
    </div>

    <!-- Content -->
    <div class="flex flex-auto justify-center w-full sm:p-6 md:p-8">
        <div class="flex flex-col flex-auto w-full sm:max-w-360 sm:shadow-lg sm:rounded-lg sm:overflow-hidden bg-default">
            <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
                 Otherwise, layout changes won't be registered and the view won't be updated! -->
                 <fuse-alert [type]="'info'" [ngClass]="{'mb-4':showSynchroWhatsappLoading}" [showIcon]="false" [appearance]="'border'" [dismissible]="true" [dismissed]="true" [name]="'synchro_whatsapp_loading'">
                    <app-whatsapp-ask-sync-toatr></app-whatsapp-ask-sync-toatr>
                </fuse-alert>
            <fuse-alert [type]="'warning'" [ngClass]="{'mb-4':showSynchroWhatsappAlert}" [showIcon]="true" [appearance]="'border'" [dismissible]="true" [dismissed]="true" [name]="'synchro_whatsapp'">
                <!-- <mat-icon class="icon-size-5" fuseAlertIcon [svgIcon]="'heroicons_solid:lock-open'"></mat-icon> -->
                <span fuseAlertTitle>Synchonisation Whatsapp</span>
                Aucun compte WhatsApp synchronzé! Veuillez synchronizer votre Whwatsapp pour pouvoir envoyer les messages
            </fuse-alert>
            <router-outlet *ngIf="true"></router-outlet>
        </div>
    </div>

    <!-- Footer -->
    <div class="relative flex flex-0 justify-center w-full px-6 md:px-8 z-49 border-t bg-card print:hidden">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 w-full max-w-360 py-4 sm:h-20">
            <span class="font-medium text-secondary">NufiSend &copy; {{currentYear}}</span>
            <nav class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-secondary" aria-label="Informations légales">
                <a routerLink="/legal/mentions-legales" class="hover:text-primary">Mentions légales</a>
                <a routerLink="/legal/confidentialite" class="hover:text-primary">Confidentialité</a>
                <a routerLink="/legal/conditions-utilisation" class="hover:text-primary">CGU</a>
                <a routerLink="/legal/cookies" class="hover:text-primary">Cookies</a>
                <a routerLink="/settings/privacy" class="hover:text-primary">Mes données</a>
            </nav>
        </div>
    </div>

</div>
