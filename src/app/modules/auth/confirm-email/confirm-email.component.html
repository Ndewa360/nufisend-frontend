<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 md:p-8">
    <div class="flex md:w-full md:max-w-6xl sm:rounded-2xl sm:shadow overflow-hidden sm:bg-card">

        <div class="w-full sm:w-auto py-8 px-4 sm:p-12 md:p-16">
            <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">

                <!-- Logo -->
                <a routerLink="/home" class="inline-flex" aria-label="NufiSend - Accueil">
                    <img src="assets/images/logo/nufisend-logo.png" alt="NufiSend" class="h-11 w-auto">
                </a>

                <!-- Titre -->
                <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">Confirmation email</div>

                <!-- Chargement -->
                <div class="flex items-center mt-8" *ngIf="loading">
                    <mat-progress-spinner [diameter]="28" [mode]="'indeterminate'"></mat-progress-spinner>
                    <span class="ml-4 text-secondary">Vérification en cours...</span>
                </div>

                <!-- Alerte -->
                <fuse-alert
                    class="mt-8"
                    *ngIf="!loading"
                    [appearance]="'outline'"
                    [showIcon]="true"
                    [type]="alert.type">
                    {{ alert.message }}
                </fuse-alert>

                <a *ngIf="!loading"
                    class="fuse-mat-button-large w-full mt-6 text-center"
                    mat-flat-button
                    [color]="'primary'"
                    [routerLink]="['/auth/sign-in']">
                    {{ emailConfirmed ? 'Se connecter' : 'Retour à la connexion' }}
                </a>

                <!-- Retour à l'accueil -->
                <div class="mt-8 text-center">
                    <a routerLink="/home" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-nufi-700">
                        <mat-icon class="icon-size-4" [svgIcon]="'heroicons_solid:arrow-left'"></mat-icon>
                        Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>

        <!-- Panneau décoratif -->
        <div class="relative hidden md:flex flex-auto items-center justify-center h-full p-16 lg:px-28 overflow-hidden bg-nufi-900 dark:border-l">
            <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
                preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
                <g class="opacity-10 text-white" fill="none" stroke="currentColor" stroke-width="100">
                    <circle r="234" cx="196" cy="23"></circle>
                    <circle r="234" cx="790" cy="491"></circle>
                </g>
            </svg>
            <div class="z-10 relative w-full max-w-2xl">
                <a routerLink="/home" class="mb-8 inline-flex items-center" aria-label="NufiSend - Accueil">
                    <img class="h-9 w-auto" src="assets/images/logo/nufisend-logo-white.png" alt="NufiSend">
                </a>
                <div class="text-6xl font-bold leading-none text-white">
                    <div>Presque</div>
                    <div>terminé</div>
                </div>
                <div class="mt-6 text-lg tracking-tight leading-6 text-slate-300">
                    La confirmation de votre email protège votre compte et débloque l'accès à NufiSend.
                </div>
            </div>
        </div>

    </div>
</div>
