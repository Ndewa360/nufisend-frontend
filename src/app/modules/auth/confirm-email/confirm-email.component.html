<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 md:p-8">
    <div class="flex md:w-full md:max-w-6xl sm:rounded-2xl sm:shadow overflow-hidden sm:bg-card">

        <div class="w-full sm:w-auto py-8 px-4 sm:p-12 md:p-16">
            <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">

                <!-- Logo -->
                <div class="w-12">
                    <img src="assets/images/logo/logo.svg" alt="NufiSend logo">
                </div>

                <!-- Titre -->
                <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">Confirmation email</div>

                <!-- Chargement -->
                <div class="flex items-center mt-8" *ngIf="loading">
                    <mat-progress-spinner [diameter]="28" [mode]="'indeterminate'"></mat-progress-spinner>
                    <span class="ml-4 text-secondary">Vérification en cours...</span>
                </div>

                <!-- Alerte -->
                <fuse-alert
                    class="mt-8"
                    *ngIf="!loading"
                    [appearance]="'outline'"
                    [showIcon]="true"
                    [type]="alert.type">
                    {{ alert.message }}
                </fuse-alert>

                <a *ngIf="!loading"
                    class="fuse-mat-button-large w-full mt-6 text-center"
                    mat-flat-button
                    [color]="'primary'"
                    [routerLink]="['/auth/sign-in']">
                    {{ emailConfirmed ? 'Se connecter' : 'Retour à la connexion' }}
                </a>
            </div>
        </div>

        <!-- Panneau décoratif -->
        <div class="relative hidden md:flex flex-auto items-center justify-center h-full p-16 lg:px-28 overflow-hidden bg-gray-800 dark:border-l">
            <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
                preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
                <g class="opacity-10 text-gray-200" fill="none" stroke="currentColor" stroke-width="100">
                    <circle r="234" cx="196" cy="23"></circle>
                    <circle r="234" cx="790" cy="491"></circle>
                </g>
            </svg>
            <div class="z-10 relative w-full max-w-2xl">
                <div class="flex items-center mb-8">
                    <img class="w-12 mr-4" src="assets/images/logo/logo.svg" alt="NufiSend logo">
                    <span class="text-2xl font-bold text-white tracking-tight">NufiSend</span>
                </div>
                <div class="text-6xl font-bold leading-none text-gray-100">
                    <div>Presque</div>
                    <div>terminé</div>
                </div>
                <div class="mt-6 text-lg tracking-tight leading-6 text-gray-400">
                    La confirmation de votre email protège votre compte et débloque l'accès à NufiSend.
                </div>
            </div>
        </div>

    </div>
</div>
