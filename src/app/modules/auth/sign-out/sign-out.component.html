<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0">
    <div class="w-full sm:w-auto py-8 px-4 sm:p-12 sm:rounded-2xl sm:shadow sm:bg-card">
        <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">

            <!-- Logo -->
            <div class="w-12 mx-auto">
                <img src="assets/images/logo/logo.svg" alt="NufiSend logo">
            </div>

            <!-- Icône succès -->
            <div class="flex items-center justify-center mt-8">
                <div class="flex items-center justify-center w-16 h-16 rounded-full bg-green-100 dark:bg-green-900">
                    <mat-icon class="text-green-500 icon-size-8" [svgIcon]="'heroicons_solid:check-circle'"></mat-icon>
                </div>
            </div>

            <!-- Titre -->
            <div class="mt-6 text-3xl font-extrabold tracking-tight leading-tight text-center">
                Déconnexion réussie
            </div>

            <!-- Countdown -->
            <div class="flex justify-center mt-2 font-medium text-secondary text-center">
                <ng-container *ngIf="countdown > 0">
                    Redirection dans {{ countdown | i18nPlural: countdownMapping }}
                </ng-container>
                <ng-container *ngIf="countdown === 0">
                    Redirection en cours...
                </ng-container>
            </div>

            <!-- Progress bar countdown -->
            <div class="mt-6 w-full bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 overflow-hidden">
                <div
                    class="bg-primary h-1.5 rounded-full transition-all duration-1000 ease-linear"
                    [style.width.%]="(countdown / 5) * 100">
                </div>
            </div>

            <!-- Lien retour -->
            <div class="mt-8 text-md font-medium text-secondary text-center">
                <span>Retourner à la page de</span>
                <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/auth/sign-in']">connexion</a>
            </div>

        </div>
    </div>
</div>
