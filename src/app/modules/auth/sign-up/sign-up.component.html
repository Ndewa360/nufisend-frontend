<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 md:p-8">
    <div class="flex md:w-full md:max-w-6xl sm:rounded-2xl sm:shadow overflow-hidden sm:bg-card">
        <div class="w-full sm:w-auto py-8 px-4 sm:p-12 md:p-16">
            <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">
                <div class="w-12">
                    <img src="assets/images/logo/ySapp_logo.png" alt="NufiSend logo">
                </div>

                <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">Créer un compte</div>
                <div class="flex items-baseline mt-0.5 font-medium">
                    <div>Vous avez déjà un compte ?</div>
                    <a class="ml-1 text-primary-500 hover:underline cursor-pointer" [routerLink]="['/auth/sign-in']">Se connecter</a>
                </div>

                <fuse-alert
                    class="mt-8 -mb-4"
                    *ngIf="showAlert"
                    [appearance]="'outline'"
                    [showIcon]="false"
                    [type]="alert.type"
                    [@shake]="alert.type === 'error'">
                    {{ alert.message }}
                </fuse-alert>

                <form class="mt-8" [formGroup]="signUpForm" (ngSubmit)="signUp()">
                    <div class="flex flex-col sm:flex-row gap-4">
                        <mat-form-field class="w-full">
                            <mat-label>Prénom</mat-label>
                            <input matInput formControlName="firstName" />
                        </mat-form-field>
                        <mat-form-field class="w-full">
                            <mat-label>Nom</mat-label>
                            <input matInput formControlName="lastName" />
                        </mat-form-field>
                    </div>

                    <mat-form-field class="w-full mt-4">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email" type="email" />
                    </mat-form-field>

                    <mat-form-field class="w-full mt-4">
                        <mat-label>Mot de passe</mat-label>
                        <input matInput formControlName="password" type="password" />
                    </mat-form-field>

                    <mat-form-field class="w-full mt-4">
                        <mat-label>Confirmer le mot de passe</mat-label>
                        <input matInput formControlName="confirmPassword" type="password" />
                    </mat-form-field>

                    <button class="fuse-mat-button-large w-full mt-6" mat-flat-button [color]="'primary'" type="submit">
                        Créer mon compte
                    </button>
                </form>
            </div>
        </div>
        <div class="relative hidden md:flex flex-auto items-center justify-center h-full p-16 lg:px-28 overflow-hidden bg-gray-800 dark:border-l">
            <div class="z-10 relative w-full max-w-2xl">
                <div class="text-7xl font-bold leading-none text-gray-100">
                    <div>Bienvenue</div>
                    <div>sur NufiSend</div>
                </div>
                <div class="mt-6 text-lg tracking-tight leading-6 text-gray-400">
                    Créez votre compte et commencez à planifier vos envois WhatsApp dès aujourd'hui.
                </div>
            </div>
        </div>
    </div>
</div>
