<div class="flex flex-auto">
    <ng-container *ngIf="!(isLoading | async); else waitForLoading">
        <ng-container *ngIf="messageTemplateModel">
            <!-- View mode -->
            <ng-container *ngIf="!editMode">
                <!-- Message template -->

                <div class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto" >
                    <!-- Header -->
                    <div class="flex items-center justify-between -mt-3 -ml-4">
        
                        <!-- Mark as ... button -->
                        <div class="pr-4 pl-3.5">
            
                            <!-- Mark as incomplete -->
                            <ng-container >
                                <div class="flex items-center justify-center">
                                    <mat-icon
                                        class="text-primary"
                                        [svgIcon]="'feather:file-text'"></mat-icon>
                                    <span class="ml-2 font-semibold ">Template | {{messageTemplateModel.title}}</span>
                                </div>
                            </ng-container>
                        </div>
            
                        <div class="flex items-center">                
                            <!-- Close button -->
                            <a
                                mat-icon-button
                                [routerLink]="['../']">
                                <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                            </a>
                        </div>
            
                    </div>

                    <!-- <mat-divider class="mt-6 mb-8"></mat-divider> -->
                    <!-- Name -->
                    <div class="mt-3  truncate">

                        <div class="flex items-center ml-auto mb-1 mt-8">
                            <button
                                mat-stroked-button
                                (click)="toggleEditMode(true)">
                                <mat-icon
                                    class="icon-size-5"
                                    [svgIcon]="'heroicons_solid:pencil-alt'"></mat-icon>
                                <span class="ml-2">Editer</span>
                            </button>

                            <button
                                mat-stroked-button
                                (click)="deleteMessageTemplateModel()" 
                                [color]="'warn'"
                                class="ml-3">
                                <mat-icon
                                    class="icon-size-5"
                                    [svgIcon]="'heroicons_solid:trash'"></mat-icon>
                                <span class="ml-2">Supprimer</span>
                            </button>
                        </div>

                    </div>
                    

                    <div class="flex flex-col mt-4 pt-6 border-t space-y-8">
                        <!-- Description -->
                        <ng-container *ngIf="messageTemplateModel?.description">
                            <div class="flex sm:items-center">
                                <mat-icon [svgIcon]="'heroicons_outline:menu-alt-2'"></mat-icon>
                                <div class="ml-6 leading-6">{{messageTemplateModel?.description}}</div>
                            </div>
                        </ng-container>

                        <!-- Content -->
                        <ng-container *ngIf="messageTemplateModel?.content">
                            <div class="flex">
                                <mat-icon [svgIcon]="'heroicons_outline:menu-alt-2'"></mat-icon>
                                <div
                                    class="max-w-none ml-6 prose prose-sm"
                                    [innerHTML]="messageTemplateModel?.content"></div>
                            </div>
                        </ng-container>
                    </div>
                    
                </div>
                   
            </ng-container>

            <!-- Edit mode -->
            <ng-container *ngIf="editMode">

                <!-- Contact form -->
                <form class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto" [formGroup]="messageTemplateModelForm">
        
                    <!-- Header -->
                    <div class="flex items-center justify-between -mt-3 -ml-4">
            
                        <!-- Mark as ... button -->
                        <div
                            class="pr-4 pl-3.5"
                            >
            
                            <!-- Mark as incomplete -->
                            <ng-container >
                                <div class="flex items-center justify-center">
                                    <mat-icon
                                        class="text-primary"
                                        [svgIcon]="'feather:file-text'"></mat-icon>
                                    <span class="ml-2 font-semibold">Template | {{messageTemplateModel.title}}</span>
                                </div>
                            </ng-container>
                        </div>
            
                        <div class="flex items-center">                
                            <!-- Close button -->
                            <a
                                mat-icon-button
                                [routerLink]="['../']">
                                <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                            </a>
                        </div>
            
                    </div>
            
                    <mat-divider class="mt-6 mb-8"></mat-divider>
            
                    <!-- Title -->
                    <div>
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Titre</mat-label>
                            <textarea
                                matInput
                                [formControlName]="'title'"
                                [spellcheck]="false"
                                cdkTextareaAutosize
                                #titleField></textarea>
                        </mat-form-field>
                    </div>
            
                    <!-- Notes -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Description</mat-label>
                            <textarea
                                matInput
                                [formControlName]="'description'"
                                [spellcheck]="false"
                                cdkTextareaAutosize></textarea>
                        </mat-form-field>
                    </div>
            
                    <!-- Body -->
                    <quill-editor
                        class="mt-8"
                        [formControlName]="'content'"
                        [bounds]="'self'"
                        [modules]="quillModules">
                        
                        <!-- <div quill-editor-toolbar>
                            <span class="ql-formats">
                            <button class="ql-bold" [title]="'Bold'"></button>
                            </span>
                            <select class="custom-parameters" [title]="'Custom Parameters'">
                                <option selected></option>
                                <option value="user_name">user_name</option>
                                <option value="request_number"></option>
                            </select>
                        </div> -->
                    </quill-editor>
            
                    <!-- Actions -->
                    <div class="flex items-center mt-10 -mx-6 sm:-mx-12 py-4 pr-4 pl-1 sm:pr-12 sm:pl-7 border-t bg-gray-50 dark:bg-transparent">
                        <!-- Delete -->
                        <button
                            mat-button
                            class="ml-auto"
                            [color]="'warn'"
                            [matTooltip]="'Supprimer'"
                            (click)="deleteMessageTemplateModel()">
                            Supprimer
                        </button>
                        <!-- Cancel -->
                        <button
                            class="ml-auto"
                            mat-button
                            [matTooltip]="'Annuler'"
                            (click)="toggleEditMode(false)">
                            Annuler
                        </button>
                        <!-- Save -->
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="messageTemplateModelForm.invalid || submitted"
                            [matTooltip]="'Enregistrer'"
                            (click)="updateMessageTemplateModel()">
                            <mat-progress-spinner
                                *ngIf="submitted"
                                [diameter]="24"
                                [mode]="'indeterminate'">
                            </mat-progress-spinner>
                            <span *ngIf="!submitted">Enregistrer</span>
                        </button>
                    </div>
            
                </form>

            </ng-container>
        </ng-container>

        <ng-container *ngIf="!messageTemplateModel">
             
            <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">
                <!-- Close button -->
                <div class="flex items-center justify-end w-full max-w-3xl mx-auto pt-6">
                    <a
                        mat-icon-button
                        [matTooltip]="'Close'"
                        [routerLink]="['../']">
                        <mat-icon
                            class="text-red"
                            [svgIcon]="'heroicons_outline:x'"></mat-icon>
                    </a>
                </div>
                <img class="mb-3 mx-auto" src="assets/images/sorry.svg" alt="Image Description" style="width: 7rem;">
                    <p class="mb-0">Contact introuvable</p>
            </div>
        </ng-container>
        
    </ng-container>
    <ng-template #waitForLoading>
        <div class="flex flex-col flex-auto mt-2 overflow-x-auto">
            <div class="absolute inset-x-0 ">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
        </div>
    </ng-template>
</div>
