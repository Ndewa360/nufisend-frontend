<!-- Github issues summary -->
<div class="sm:col-span-2 md:col-span-4 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
    <div class="flex flex-col sm:flex-row items-start justify-between">
        <div class="text-lg font-medium tracking-tight leading-6 truncate">Activités planifiés</div>
        <div class="mt-3 sm:mt-0 sm:ml-2">
            <!-- <mat-button-toggle-group
                value="this-week"
                #githubIssuesWeekSelector="matButtonToggleGroup">
                <mat-button-toggle value="last-week">Last Week</mat-button-toggle>
                <mat-button-toggle value="this-week">This Week</mat-button-toggle>
            </mat-button-toggle-group> -->
            <button mat-button (click)="prevWeekData()">
                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-left'" [title]="'Précédent'"></mat-icon>
                Prec</button>
            <span>{{planificationFirstDateChart | date : "dd MMM yyyy"}} -- {{planificationEndDateChart | date : "dd MMM yyyy"}}</span>
            <button mat-button (click)="nextWeekData()">
                Suiv <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-right'" [title]="'Suivant'" aria-hidden="true" iconPositionEnd></mat-icon>  
            </button>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 grid-flow-row gap-6 w-full mt-8 sm:mt-4">
        <!-- New vs. Closed -->
        <div class="flex flex-col flex-auto">
            <div class="font-medium text-secondary">Active vs. Inactive</div>
            <div class="flex flex-col flex-auto">
                <!-- [githubIssuesWeekSelector.value] -->
                <apx-chart
                    #planifChart
                    class="flex-auto w-full h-80"
                    [chart]="planificationsChartOption.chart"
                    [colors]="planificationsChartOption.colors"
                    [dataLabels]="planificationsChartOption.dataLabels"
                    [grid]="planificationsChartOption.grid"
                    [labels]="planificationsChartOption.labels"
                    [legend]="planificationsChartOption.legend"
                    [plotOptions]="planificationsChartOption.plotOptions"
                    [series]="planificationsChartOption.series" 
                    [states]="planificationsChartOption.states"
                    [stroke]="planificationsChartOption.stroke"
                    [tooltip]="planificationsChartOption.tooltip"
                    [xaxis]="planificationsChartOption.xaxis"
                    [yaxis]="planificationsChartOption.yaxis"></apx-chart>
            </div>
        </div>
        <!-- Overview -->
        <div class="flex flex-col">
            <div class="font-medium text-secondary">Details</div>
            <!-- <div class="flex-auto grid grid-cols-4 gap-4 mt-6">
            </div> -->
            <div class="sm:col-span-2 md:col-span-4 lg:col-span-2 flex flex-col flex-auto p-6 overflow-hidden">
                <div class="flex flex-col sm:flex-row items-start justify-between">
                    <div class="text-lg font-medium tracking-tight leading-6 truncate">
                        <div class="flex-auto mat-mdc-form-field">
                            <div class="mat-mdc-floating-label font-semibold ">Choisir le jour de la semaine</div>
                            <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" >
                                <a *ngFor="let day of listOfDay; let i=index" (click)="selectDay(i)"  
                                    [ngClass]="{'rounded-l-md':i==0,'rounded-r-md':i==6,'z-10 bg-green-800 text-white':day==selectedDayOfWeek}" 
                                    class="relative inline-flex items-center px-4 py-2 text-sm font-semibold cursor-pointer ring-1 ring-inset ring-gray-300 hover:bg-emerald-900 hover:text-white focus:z-20 focus:outline-offset-0">
                                    {{day}}
                                </a>
                            </nav>
                          </div>
                    </div>
                   
                </div>
                <app-schedule-list-day [planingList]="selectedPlanificationsDayData"></app-schedule-list-day>
            </div>
        </div>
    </div>
</div>
