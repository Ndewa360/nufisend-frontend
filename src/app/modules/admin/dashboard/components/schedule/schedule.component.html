<!-- Calendrier des envois de la semaine -->
<div class="sm:col-span-2 md:col-span-4 flex flex-col flex-auto p-6 bg-card shadow rounded-2xl overflow-hidden">
    <div class="flex flex-col sm:flex-row items-start justify-between">
        <div class="text-lg font-medium tracking-tight leading-6 truncate">Activités planifiées</div>
        <div class="mt-3 sm:mt-0 sm:ml-2 flex items-center">
            <button mat-button (click)="prevWeekData()">
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:chevron-left'" [title]="'Précédent'"></mat-icon>
                Précédent
            </button>
            <span class="mx-2">{{weekStart | date : "dd MMM yyyy"}} – {{weekEnd | date : "dd MMM yyyy"}}</span>
            <button mat-button (click)="nextWeekData()">
                Suivant
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:chevron-right'" [title]="'Suivant'" iconPositionEnd></mat-icon>
            </button>
        </div>
    </div>

    <mat-progress-bar *ngIf="loading" class="mt-4" [mode]="'indeterminate'"></mat-progress-bar>

    <div class="grid grid-cols-1 lg:grid-cols-2 grid-flow-row gap-6 w-full mt-8 sm:mt-4">
        <!-- Envois par jour de la semaine -->
        <div class="flex flex-col flex-auto">
            <div class="font-medium text-secondary">Envois par jour de la semaine</div>
            <div class="flex flex-col flex-auto">
                <div *ngIf="loadError" class="h-80 flex items-center justify-center text-sm text-amber-700 dark:text-amber-400">
                    Impossible de charger le calendrier pour le moment.
                </div>
                <apx-chart
                    *ngIf="!loadError"
                    class="flex-auto w-full h-80"
                    [chart]="chartOptions.chart"
                    [colors]="chartOptions.colors"
                    [dataLabels]="chartOptions.dataLabels"
                    [grid]="chartOptions.grid"
                    [labels]="chartOptions.labels"
                    [legend]="chartOptions.legend"
                    [plotOptions]="chartOptions.plotOptions"
                    [series]="chartOptions.series"
                    [states]="chartOptions.states"
                    [stroke]="chartOptions.stroke"
                    [tooltip]="chartOptions.tooltip"
                    [xaxis]="chartOptions.xaxis"
                    [yaxis]="chartOptions.yaxis"></apx-chart>
            </div>
        </div>

        <!-- Detail du jour -->
        <div class="flex flex-col">
            <div class="font-medium text-secondary">Détail du {{selectedDayLabel.toLowerCase()}}</div>
            <div class="flex flex-col sm:flex-row items-start justify-between mt-3">
                <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm">
                    <a *ngFor="let day of dayLabels; let i=index" (click)="selectDay(i)"
                        [ngClass]="{'rounded-l-md':i==0,'rounded-r-md':i==6,'z-10 bg-green-800 text-white':i==selectedDayIndex}"
                        class="relative inline-flex items-center px-3 py-2 text-sm font-semibold cursor-pointer ring-1 ring-inset ring-gray-300 hover:bg-emerald-900 hover:text-white focus:z-20">
                        {{day}}
                    </a>
                </nav>
            </div>
            <app-schedule-list-day
                [entries]="selectedDayEntries"
                [loading]="loading"
                [loadError]="loadError"
                (retry)="retry()"></app-schedule-list-day>
        </div>
    </div>
</div>
