<!-- Planifications du jour selectionne -->
<div class="flex flex-col mt-2">
    <div *ngIf="loading" class="py-6 text-secondary text-sm">Chargement du calendrier...</div>

    <div *ngIf="!loading && loadError" class="py-6 flex flex-col items-start gap-2">
        <span class="text-sm text-amber-700 dark:text-amber-400">Impossible de charger le calendrier pour le moment.</span>
        <button mat-stroked-button color="primary" type="button" (click)="retry.emit()">Réessayer</button>
    </div>

    <div *ngIf="!loading && !loadError && entries.length === 0" class="py-6 text-secondary text-sm">
        Aucune planification ce jour.
    </div>

    <div *ngIf="!loading && !loadError && entries.length > 0" class="flex flex-col divide-y">
        <div *ngFor="let entry of entries" class="flex flex-row items-center justify-between py-4 px-0.5 gap-4">
            <div class="flex flex-col min-w-0">
                <div class="font-medium truncate">{{entry.title || 'Sans titre'}}</div>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-2">
                    <div *ngFor="let slot of entry.times" class="flex items-center" [class.opacity-50]="slot.past">
                        <mat-icon class="icon-size-5 text-hint" [svgIcon]="'heroicons_solid:clock'"></mat-icon>
                        <div class="ml-1.5 text-md text-secondary">
                            {{slot.time}}<span *ngIf="slot.past" class="ml-1 text-xs">(passé)</span>
                        </div>
                    </div>
                </div>
            </div>
            <span class="shrink-0 px-2 py-0.5 rounded-full text-xs font-semibold" [ngClass]="toneClasses[entry.status.tone]">
                {{entry.status.label}}
            </span>
        </div>
    </div>
</div>
