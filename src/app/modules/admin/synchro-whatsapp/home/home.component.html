<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div class="bg-card">
        <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
            <div class="flex flex-col sm:flex-row flex-auto sm:items-center min-w-0 my-8 sm:my-12">
                <!-- Avatar and name -->
                <div class="flex flex-auto items-center min-w-0">
                    <div class="flex-0 w-30 h-30 rounded-full overflow-hidden">
                        <img
                            class="w-full h-full object-cover"
                            src="assets/images/logo/whatsapp_logo.png">
                    </div>
                    <div class="flex flex-col min-w-0 ml-4">
                        <ng-container *transloco="let t">
                            <div class="text-2xl md:text-5xl font-semibold tracking-tight leading-7 md:leading-snug truncate">Synchronization Whatsapp</div>
                        </ng-container>
                        <div class="flex items-center">
                            <mat-icon
                                class="icon-size-5"
                                [svgIcon]="'heroicons_solid:information-circle'"></mat-icon>
                            <div class="ml-1.5 leading-6 truncate text-secondary">Synchronizer toutes les informations de votre compte Whatsapp sur votre espace </div>
                        </div>
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex items-center mt-6 sm:mt-0 sm:ml-2 space-x-3">
                    <button
                        class="bg-accent"
                        mat-flat-button
                        [color]="'accent'">
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:mail'"></mat-icon>
                        <span class="ml-2">Messages</span>
                    </button>
                    <button
                        mat-flat-button
                        [color]="'primary'">
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:cog'"></mat-icon>
                        <span class="ml-2">Settings</span>
                    </button>
                </div>
            </div>
            
        </div>
        
    </div>

    <!-- Main -->
    <div class="flex-auto border-t -mt-px pt-4 sm:pt-6">
        <div class="w-full max-w-screen-xl mx-auto">
            <!-- Tabs -->
            <mat-tab-group
                class="sm:px-2"
                mat-stretch-tabs="false"
                [animationDuration]="'0'">

                <!-- Home -->
                <mat-tab >
                    <ng-template mat-tab-label>
                        <span class="inline-flex items-center space-x-2" >
                            <ng-container *ngIf=" userProfile$|async as userProfile">
                                <span class="w-2 h-2 mr-1 rounded-full " [ngClass]="{'bg-green-500': userProfile.hasSyncWhatsApp,'bg-red-500':!userProfile.hasSyncWhatsApp}"></span>
                            </ng-container>                            
                            <span class="">Statut</span>
                        </span>
                    </ng-template>
                    <ng-template matTabContent>
                        <div class="grid grid-cols-1 sm:grid-cols-6 gap-6 w-full min-w-0">
                            <!-- Summary -->
                            <div class="sm:col-span-6 flex flex-col flex-auto p-6 bg-card shadow overflow-hidden">
                                <app-qrcode-synchro-statut></app-qrcode-synchro-statut> 
                            </div>
                        </div>
                    </ng-template>
                </mat-tab>

                <!-- Budget -->
                <!-- <mat-tab label="Profil">
                    <ng-template matTabContent>
                        <div class="grid grid-cols-1 sm:grid-cols-6 gap-6 w-full min-w-0">
                            <div class="sm:col-span-6 flex flex-col flex-auto p-6 bg-card shadow overflow-hidden">
                                <app-whatsapp-profile></app-whatsapp-profile> 
                            </div>
                        </div>
                    </ng-template>
                </mat-tab> -->

                <!-- Team -->
                <mat-tab>
                    <ng-template mat-tab-label>
                        <span class="inline-flex items-center space-x-2">
                            <span class="">Contact</span>
                            <span class="px-2 py-1 text-sm rounded-full bg-primary-100 text-on-primary-100">{{contactsNbre}}</span>
                        </span>
                    </ng-template>
                    <ng-template matTabContent>
                        <div class="grid grid-cols-1 sm:grid-cols-6 gap-6 w-full min-w-0">
                            <!-- Summary -->
                            <div class="sm:col-span-6 flex flex-col flex-auto p-6 bg-card shadow overflow-hidden">
                                <app-whatsapp-contact></app-whatsapp-contact> 
                            </div>
                        </div>
                    </ng-template>
                </mat-tab>

            </mat-tab-group>
        </div>
    </div>

</div>
