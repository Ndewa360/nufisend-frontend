<div class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
    <div class="p-6">
        <div class="mr-4 text-lg font-medium tracking-tight leading-6 truncate">Tâches planifiés</div>
        <div class="text-secondary font-medium"> </div>
    </div>
    <div class="overflow-x-auto mx-6">
        <table
            class="w-full bg-transparent"
            mat-table
            matSort
            [dataSource]="dataSource"
            [trackBy]="trackByFn"
            #dataTable>

            <!-- Titre -->
            <ng-container matColumnDef="titre">
                <th
                    mat-header-cell
                    mat-sort-header
                    *matHeaderCellDef>
                    Titre
                </th>
                <td
                    mat-cell
                    *matCellDef="let plan">
                    <span class="pr-6 font-medium text-sm text-secondary whitespace-nowrap">
                        <span class="w-2 h-2 rounded-full"
                              [ngClass]="{'bg-green-500': plan.isActive == true,
                                    'bg-amber-500': plan.isActive == false}"></span>
                        {{plan.title}}
                    </span>
                </td>
            </ng-container>

            <!-- Date -->
            <ng-container matColumnDef="date">
                <th
                    mat-header-cell
                    mat-sort-header
                    *matHeaderCellDef>
                    Date de création
                </th>
                <td
                    mat-cell
                    *matCellDef="let plan">
                    <span class="pr-6 whitespace-nowrap">
                        {{plan.createdAt | date:'dd MMM y'}}
                    </span>
                </td>
            </ng-container>

            <!-- Destinataire -->
            <ng-container matColumnDef="destinataires">
                <th
                    mat-header-cell
                    mat-sort-header
                    *matHeaderCellDef>
                    Destinataires
                </th>
                <td
                    mat-cell
                    *matCellDef="let plan">
                    <span class="pr-6 whitespace-nowrap">
                        <!-- Members -->
                    <ng-container *ngIf="plan.message.contacts?.length">
                        <!-- <div class="w-12 h-1 mt-6 border-t-2"></div> -->
                        <mat-menu #contactListMenu="matMenu">
                            <button mat-menu-item *ngFor="let contact of contactList">
                                <a  class="z-20 w-full flex items-center px-6 py-4 md:px-8 cursor-pointer border-b">
                                <div class="flex flex-0 items-center justify-center w-10 h-10 rounded-full overflow-hidden">
                                    <ng-container *ngIf="(contact | async).avatar">
                                        <img class="object-cover w-full h-full" [src]="(contact | async).avatar" [alt]="(contact | async).fullName.charAt(0)"/>
                                    </ng-container>
                                    <ng-container *ngIf="!(contact | async).avatar">
                                        <div class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
                                            {{(contact | async).fullName.charAt(0)}}
                                        </div>
                                    </ng-container>
                                </div>
                                <div class="min-w-0 ml-4">
                                    <div class="font-medium leading-5 truncate">{{(contact | async).fullName}}</div>
                                    <div class="leading-5 truncate text-secondary">{{(contact | async).jobTitle}} {{(contact | async).company?" - "+(contact | async).company:""}}</div>
                                </div>

                            </a>
                            </button>
                          </mat-menu>
                        <div class="flex items-center mt-6 -space-x-1.5">
                            <!--  -->
                            <ng-container *ngFor="let memberId of plan.message.contacts.slice(0, 3); trackBy: trackByFn" >
                                <div [matMenuTriggerFor]="contactListMenu" (click)="getListOfContactDetail(plan.message.contacts)" class="cursor-pointer flex items-center -space-x-1.5">
                                    <img
                                        class="flex-0 w-8 h-8 rounded-full ring ring-offset-1 ring-bg-card ring-offset-transparent object-cover"
                                        *ngIf="(getContactDetail(memberId) | async)?.avatar; else noAvatar;"
                                        [src]="(getContactDetail(memberId) | async)?.avatar">
                                    <ng-template #noAvatar >
                                        <div
                                            class="flex flex-0 items-center justify-center w-8 h-8 rounded-full ring ring-offset-1 ring-bg-card ring-offset-transparent bg-gray-200 text-gray-500"
                                            *ngIf="!(getContactDetail(memberId)?.avatar)">
                                            <div class="text-md font-semibold">
                                                {{(getContactDetail(memberId) | async)?.fullName?.charAt(0)}}
                                            </div>
                                        </div>
                                    </ng-template>
                                </div>

                                <!-- <img
                                    *ngIf="!contact?.avatar"
                                    [src]="member.avatar"
                                    alt="Member avatar"> -->
                            </ng-container>                            
                            <ng-container *ngIf="plan.message.contacts.length > 5">
                                <div class="flex flex-0 items-center justify-center w-8 h-8 rounded-full ring ring-offset-1 ring-bg-card ring-offset-transparent bg-gray-200 text-gray-500">
                                    <div class="text-md font-semibold">
                                        +{{ plan.message.contacts.slice(3).length }}
                                    </div>
                                </div>
                            </ng-container>
                        </div>
                    </ng-container>
                    </span>
                </td>
            </ng-container>

            <!-- Groupes -->
            <ng-container matColumnDef="groupes">
                <th
                    mat-header-cell
                    mat-sort-header
                    *matHeaderCellDef>
                    Groupes
                </th>
                <td
                    mat-cell
                    *matCellDef="let plan">
                    <span class="pr-6 font-medium whitespace-nowrap">
                        Groupes
                    </span>
                </td>
            </ng-container>

            <!-- Action -->
            <ng-container matColumnDef="action">
                <th
                    mat-header-cell
                    mat-sort-header
                    *matHeaderCellDef>
                    Action
                </th>
                <td
                    mat-cell
                    *matCellDef="let plan">
                    action
                </td>
            </ng-container>

            <!-- Footer -->
            <ng-container matColumnDef="dataTableFooter">
                <td
                    class="py-6 px-0 border-0"
                    mat-footer-cell
                    *matFooterCellDef
                    colspan="6">
                    <!-- <button mat-stroked-button>See all transactions</button> -->
                </td>
            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="dataTableColumns"></tr>
            <tr
                class="order-row h-16"
                mat-row
                *matRowDef="let row; columns: dataTableColumns;"></tr>
            <tr
                class="h-16 border-0"
                mat-footer-row
                *matFooterRowDef="['dataTableFooter']"></tr>
        </table>
    </div>
</div>
