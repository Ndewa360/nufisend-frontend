<div class="flex flex-col md:min-w-160 md:max-h-screen  -m-6">
    <!-- Header -->
    <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-primary text-on-primary shadow-lg">
        <div class="text-lg font-medium">Nouveau message</div>
        <button
            mat-icon-button
            (click)="saveAndClose()"
            [tabIndex]="-1">
            <mat-icon
                class="text-current"
                [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>

    <fuse-alert *ngIf="!isWhatsAppSynced" class="m-4 sm:mx-8" [type]="'warning'" [appearance]="'border'" [showIcon]="true">
        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
            <span>Votre compte WhatsApp n'est pas synchronisé. Vous devez le synchroniser avant d'envoyer des messages.</span>
            <a mat-button color="primary" routerLink="/sync_whatsapp" (click)="saveAndClose()">Synchroniser maintenant</a>
        </div>
    </fuse-alert>

    <!-- Compose form -->
    <div class="flex flex-col md:h-full  flex-auto p-6 sm:p-8 overflow-y-auto">
        <!-- <form class="p-4 bg-card shadow rounded " [formGroup]="newMessageForm"> -->
            <app-rediger-message-direct (sendMessageData)="setMessage($event)" ></app-rediger-message-direct>
            <div class="flex justify-end mt-8">
                <button
                    class="px-8 mr-2"
                    mat-flat-button
                    [color]="'accent'"
                    (click)="saveAndClose()"
                    type="button">
                    Annulé
                </button>
                <button
                    class="px-8"
                    mat-flat-button
                    [color]="'primary'"
                    [disabled]="(isSendingMessage | async) || !isWhatsAppSynced"
                    [matTooltip]="isWhatsAppSynced ? '' : 'Synchronisez votre compte WhatsApp pour envoyer'"
                    (click)="sendMessage()">
                    <mat-progress-spinner *ngIf="(isSendingMessage | async); else endWordTermine" [diameter]="24" [mode]="'indeterminate'">
                    </mat-progress-spinner>
                    <ng-template #endWordTermine>
                        <mat-icon mat-button class="icon-size-4 " [svgIcon]="'feather:send'" [title]="'Annuler'"></mat-icon>
                        Envoyé
                    </ng-template>
                </button>
            </div>
        <!-- </form> -->
    </div>

</div>
