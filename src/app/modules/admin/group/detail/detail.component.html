<div class="flex flex-col w-full">
    <ng-container *ngIf="!isLoading; else waitForLoading">
        <ng-container *ngIf="groupModel">
            <!-- View mode -->
            <ng-container *ngIf="!editMode">
                <!-- Message template -->

                <div class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto" >
                    <!-- Header -->
                    <div class="flex items-center justify-between -mt-3 -ml-4">
        
                        <!-- Mark as ... button -->
                        <div class="pr-4 pl-3.5">
            
                            <!-- Mark as incomplete -->
                            <ng-container >
                                <div class="flex items-center justify-center">
                                    <mat-icon
                                        class="text-primary"
                                        [svgIcon]="'heroicons_outline:user-group'"></mat-icon>
                                    <span class="ml-2 font-semibold ">Groupe | {{groupModel.name}}</span>
                                </div>
                            </ng-container>
                        </div>
            
                        <div class="flex items-center">                
                            <!-- Close button -->
                            <a
                                mat-icon-button
                                [routerLink]="['../']">
                                <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                            </a>
                        </div>
            
                    </div>

                    <!-- <mat-divider class="mt-6 mb-8"></mat-divider> -->
                    <!-- Name -->
                    <div class="mt-3  truncate">

                        <div class="flex items-center ml-auto mb-1 mt-8">
                            <button
                                mat-stroked-button
                                (click)="toggleEditMode(true)">
                                <mat-icon
                                    class="icon-size-5"
                                    [svgIcon]="'heroicons_solid:pencil-alt'"></mat-icon>
                                <span class="ml-2">Editer</span>
                            </button>

                            <button
                                mat-stroked-button
                                (click)="deleteGroup()" 
                                [color]="'warn'"
                                class="ml-3">
                                <mat-icon
                                    class="icon-size-5"
                                    [svgIcon]="'heroicons_solid:trash'"></mat-icon>
                                <span class="ml-2">Supprimer</span>
                            </button>
                        </div>

                    </div>
                    

                    <div class="flex flex-col mt-4 pt-6 border-t space-y-8">
                        <!-- Description -->
                        <ng-container *ngIf="groupModel?.description">
                            <div class="flex sm:items-center">
                                <mat-icon [svgIcon]="'heroicons_outline:menu-alt-2'"></mat-icon>
                                <div class="ml-6 leading-6">{{groupModel?.description}}</div>
                            </div>
                        </ng-container>
                    </div>

                    <!-- Group -->
                    <div>
                        <div
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <app-select-contact [isNewGroup]="false" [selectedGroup]="groupModel" [editMode]="editMode"></app-select-contact>
                        </div>
                    </div>
                    
                </div>
                   
            </ng-container>

            <!-- Edit mode -->
            <ng-container *ngIf="editMode">

                <!-- Contact form -->
                <form class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto" [formGroup]="groupForm">
        
                    <!-- Header -->
                    <div class="flex items-center justify-between -mt-3 -ml-4">
            
                        <!-- Mark as ... button -->
                        <div
                            class="pr-4 pl-3.5"
                            >
            
                            <!-- Mark as incomplete -->
                            <ng-container >
                                <div class="flex items-center justify-center">
                                    <mat-icon
                                        class="text-primary"
                                        [svgIcon]="'heroicons_outline:user-group'"></mat-icon>
                                    <span class="ml-2 font-semibold">Groupe | {{groupModel.name}}</span>
                                </div>
                            </ng-container>
                        </div>
            
                        <div class="flex items-center">                
                            <!-- Close button -->
                            <a
                                mat-icon-button
                                [routerLink]="['../']">
                                <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                            </a>
                        </div>
            
                    </div>
            
                    <mat-divider class="mt-6 mb-8"></mat-divider>
            
                    <!-- Title -->
                    <div>
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Nom</mat-label>
                            <textarea
                                matInput
                                [formControlName]="'name'"
                                [spellcheck]="false"
                                cdkTextareaAutosize
                                #titleField></textarea>
                        </mat-form-field>
                    </div>
            
                    <!-- Notes -->
                    <div class="mt-8">
                        <mat-form-field
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <mat-label>Description</mat-label>
                            <textarea
                                matInput
                                [formControlName]="'description'"
                                [spellcheck]="false"
                                [rows]="3"></textarea>
                        </mat-form-field>
                    </div>

                    <!-- Group -->
                    <div>
                        <div
                            class="w-full"
                            [subscriptSizing]="'dynamic'">
                            <app-select-contact [isNewGroup]="false" [selectedGroup]="groupModel" [editMode]="editMode" (contactsSelected)="selectedContactEvent($event)"></app-select-contact>
                        </div>
                    </div>
            
            
                    <!-- Actions -->
                    <div class="flex items-center mt-10 -mx-6 sm:-mx-8 py-4 pr-4 pl-1 sm:pr-12 sm:pl-7 border-t bg-gray-50 dark:bg-transparent">
                        <!-- Delete -->
                        <button
                            mat-button
                            [color]="'warn'"
                            [matTooltip]="'Supprimer'"
                            (click)="deleteGroup()">
                            Supprimer
                        </button>
                        <!-- Cancel -->
                        <button
                            class="ml-auto"
                            mat-button
                            [matTooltip]="'Annuler'"
                            (click)="toggleEditMode(false)">
                            Annuler
                        </button>
                        <!-- Save -->
                        <button
                            class="ml-2"
                            mat-flat-button
                            [color]="'primary'"
                            [disabled]="groupForm.invalid || submitted"
                            [matTooltip]="'Enregistrer'"
                            (click)="updateGroup()">
                            <mat-progress-spinner
                                *ngIf="submitted"
                                [diameter]="24"
                                [mode]="'indeterminate'">
                            </mat-progress-spinner>
                            <span *ngIf="!submitted">Enregistrer</span>
                        </button>
                    </div>
            
                </form>

            </ng-container>
        </ng-container>

        <ng-container *ngIf="!groupModel">
             
            <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">
                <!-- Close button -->
                <div class="flex items-center justify-end w-full max-w-3xl mx-auto pt-6">
                    <a
                        mat-icon-button
                        [matTooltip]="'Close'"
                        [routerLink]="['../']">
                        <mat-icon
                            class="text-red"
                            [svgIcon]="'heroicons_outline:x'"></mat-icon>
                    </a>
                </div>
                <img class="mb-3 mx-auto" src="assets/images/sorry.svg" alt="Image Description" style="width: 7rem;">
                    <p class="mb-0">Groupe introuvable</p>
            </div>
        </ng-container>
        
    </ng-container>
    <ng-template #waitForLoading>
        <div class="flex flex-col flex-auto mt-2 overflow-x-auto">
            <div class="absolute inset-x-0 ">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
        </div>
    </ng-template>
</div>
