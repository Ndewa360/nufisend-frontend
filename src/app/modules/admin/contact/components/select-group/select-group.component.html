<div class="flex flex-col">

    <!-- Main -->
    <div class="flex-auto">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row md:flex-col flex-auto justify-between py-8 px-6 md:px-8" *ngIf="editMode">

            <!-- Main actions -->
            <div class="flex w-full items-center mt-4 sm:mt-0 md:mt-4 ">
                <!-- Search -->
                <div class="flex-auto">
                    <mat-form-field class="fuse-mat-dense fuse-mat-rounded w-full min-w-50" subscriptSizing="dynamic">
                        <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
                        <input matInput [formControl]="searchInputControl" [matAutocomplete]="auto" [placeholder]="'Search groups'">
                    </mat-form-field>
                </div>
                
            </div>
        </div>

        <!-- Groups list -->
        <!-- absolute z-10    -->
        <!-- <div [ngClass]="visibilityClasses" class="z-10  max-h-72 overflow-auto rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none  "> -->
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
                <fuse-loading-bar *ngIf="(loading$ | async)"></fuse-loading-bar>
                <mat-optgroup *ngIf="!(loading$ | async)" [label]="'Groups ('+groupsFiltered.length+')'">
                    <mat-option (click)="selectGroup(group)" *ngFor="let group of groupsFiltered; let i = index;" [value]="group.name">
                        <!-- Group " -->
                        <a  class="z-20 w-full flex items-center px-6 py-4 md:px-8 cursor-pointer border-b"
                            [ngClass]="{'hover:bg-gray-100 dark:hover:bg-hover': !selectectGroups.has(group._id),
                                        'bg-primary-50 dark:bg-hover': selectectGroups.has(group._id)}"
                            >
                            <div class="flex flex-0 items-center justify-center w-10 h-10 rounded-full overflow-hidden">
                                <ng-container *ngIf="group.avatar">
                                    <img class="object-cover w-full h-full" [src]="group.avatar" [alt]="group.name.charAt(0)"/>
                                </ng-container>
                                <ng-container *ngIf="!group.avatar">
                                    <div class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
                                        {{group.name.charAt(0)}}
                                    </div>
                                </ng-container>
                            </div>
                            <div class="min-w-0 ml-4">
                                <div class="font-medium leading-5 truncate">{{group.name}}</div>
                            </div>

                        </a>
                    </mat-option>
                </mat-optgroup>
                

                <mat-option *ngIf="(loading$ | async)" [value]="''">
                    <div class="m-2">
                       Chargement en cours...                                
                    </div>
                </mat-option>

                <mat-option *ngIf="!(loading$ | async) && groupsFiltered.length==0" [value]="''">
                    <div class="p-3 sm:p-10 border-t text-4xl font-semibold tracking-tight text-center">
                        <img class="mx-auto" src="assets/images/sorry.svg" alt="Image Description" style="width: 4rem;">
                            <p class="mb-0">Aucun group trouvé</p>
                    </div>
                </mat-option>
            </mat-autocomplete>                                

        <!-- </div> -->

        <div class="flex gap-5 gap-y-7 sm:flex-col md:flex-row flex-auto justify-between py-8 ">
            
            <div class="w-full">                       
                <div class="flex-auto overflow-y-auto">
                    <ng-container *ngIf="selectedGroupList.length > 0; else noGroup">
                        <ng-container>
                            <div class="z-10 sticky top-0 -mt-px px-6 py-1 md:px-8 border-t border-b font-medium uppercase text-secondary bg-gray-50 dark:bg-gray-900">
                                Membres ({{selectedGroupList.length}})
                            </div>
                        </ng-container>
                        <ng-container *ngFor="let group of selectedGroupList">
                         
                            <a  class="flex items-center px-6 py-4 md:px-8  border-b" >
                            <div class="flex flex-0 items-center justify-center w-10 h-10 rounded-full overflow-hidden">
                                <ng-container *ngIf="group.avatar">
                                    <img
                                        class="object-cover w-full h-full"
                                        [src]="group.avatar"
                                        alt="Avatar Group"/>
                                </ng-container>
                                <ng-container *ngIf="!group.avatar">
                                    <div class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
                                        {{group.name.charAt(0)}}
                                    </div>
                                </ng-container>
                            </div>
                            <div class="w-10/12 min-w-0 ml-4">
                                <div class="font-medium leading-5 truncate">{{group.name}}</div>
                            </div>
                            <div *ngIf="editMode" class=" w-6 h-6 mr-3 cursor-pointer float-right" (click)="removeGroup(group)">
                                <mat-icon
                                mat-button
                                    class="icon-size-6 text-red-600 dark:text-red-400"
                                    [svgIcon]="'heroicons_outline:trash'"
                                    [matTooltip]="'Rétirer le group'"></mat-icon>
                            </div> 
                        </a>
                        </ng-container>
                    </ng-container>

                     <!-- No group template -->
                    <ng-template #noGroup>
                        <div class="flex flex-auto flex-col items-center justify-center h-full">
                            <mat-icon
                                class="icon-size-16"
                                [svgIcon]="'mat_outline:person'"></mat-icon>
                            <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">Aucun group séléctionné</div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
          

    </div>

</div>
