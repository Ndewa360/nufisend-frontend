<div class="flex flex-col md:min-w-160  -m-6">

    <!-- Header -->
    <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-primary text-on-primary shadow-lg">
        <div class="text-lg font-medium">Importer vos contacts</div>
        <button
            mat-icon-button
            (click)="saveAndClose()"
            [tabIndex]="-1">
            <mat-icon
                class="text-current"
                [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>

    <!-- Compose form -->
    <div class="flex flex-col flex-auto p-x-6 p-y-3 sm:p-8  md:h-full overflow-y-auto">
        <form class="p-4 bg-card shadow rounded "
                [formGroup]="newMessageForm">
                <!--  -->
                <mat-horizontal-stepper  [linear]="true" #horizontalStepper>
                    <mat-step [formGroupName]="'stepSelectContacts'" [completed]="destinationContacts.length>0 || destinationGroups.length>0"   #horizontalStepperStep1>
                        <ng-template matStepLabel>Destinataires</ng-template>                        
                        <app-select-contacts-groups (contactsAndGroupsSelected)="getDestinationMessageData($event)" class="flex"></app-select-contacts-groups>
                        <div class="flex justify-end">                            
                            <button class="px-8" mat-flat-button extended [color]="'primary'" [disabled]="destinationContacts.length==0 && destinationGroups.length==0" type="button" matStepperNext>
                                Suivant
                                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-right'" [title]="'Suivant'" aria-hidden="true" iconPositionEnd></mat-icon>    
                            </button>
                        </div>
                    </mat-step>

                    <mat-step [formGroupName]="'stepSelectTypeMessage'"  #horizontalStepperStep2>
                        <ng-template matStepLabel>Type de message</ng-template>
                        <app-select-message-type (isSentToNow)="setMessageType($event)"></app-select-message-type>
                        
                        <div class="flex justify-end">
                            <button
                                class="px-8 mr-2"
                                mat-flat-button
                                [color]="'accent'"
                                type="button"
                                matStepperPrevious>
                                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-left'" [title]="'Précédent'"></mat-icon>
                                Précédent
                            </button>
                            <button
                                class="px-8"
                                mat-flat-button
                                [color]="'primary'"
                                type="button"
                                matStepperNext>
                                Suivant 
                                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-right'" [title]="'Suivant'" iconPositionEnd></mat-icon>
                            </button>
                        </div>
                    </mat-step>

                    <mat-step *ngIf="!messageSendToNow" [completed]="planificationObj.hasPlanification">
                        <ng-template matStepLabel>Planifier</ng-template>
                        <p class="my-6 font-medium">
                            <app-planifier-date-envoi (planficationDateEvent)="setPlanification($event)"></app-planifier-date-envoi>
                        </p>
                        <div class="flex justify-end mt-8">
                            <button
                                class="px-8 mr-2"
                                mat-flat-button
                                [color]="'accent'"
                                type="button"
                                matStepperPrevious>
                                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-left'" [title]="'Précédent'"></mat-icon>
                                Précédent
                            </button>
                            <button
                                class="px-8"
                                mat-flat-button
                                [color]="'primary'"
                                type="button"
                                [disabled]="!planificationObj.hasPlanification"
                                matStepperNext>
                                Suivant
                                <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-right'" [title]="'Suivant'" iconPositionEnd></mat-icon>
                            </button>
                        </div>
                    </mat-step>
                  
                    <mat-step [completed]="isSendingMessage | async">
                        <ng-template matStepLabel>Rediger & Soumettre</ng-template>
                        <app-rediger-message-direct (sendMessageData)="setMessage($event)"></app-rediger-message-direct>
                        <!-- <ng-template #redigerMessagePlanifier><app-rediger-message-planifier></app-rediger-message-planifier></ng-template>  -->
                        <div class="flex mt-8 justify-between">
                            <div class="">
                                <button
                                    mat-button
                                    [color]="'primary'"
                                    [disabled]="!canPrevisualise()"
                                    (click)="privisualiserMessage()"
                                    [matTooltip]="'Prévisualiser le message'">
                                    Prévisualiser
                                </button>
                            </div>
                            <div class="flex justify-end">
                                <button
                                    class="px-8 mr-2"
                                    mat-flat-button
                                    [color]="'accent'"
                                    type="button"
                                    matStepperPrevious>
                                    <mat-icon mat-button class="icon-size-4 " [svgIcon]="'heroicons_outline:chevron-left'" [title]="'Précédent'"></mat-icon>
                                    Précédent
                                </button>
                                <button
                                    class="px-8"
                                    mat-flat-button
                                    [color]="'primary'"
                                    [disabled]="isSendingMessage | async"
                                    (click)="sendMessage()">
                                    <mat-progress-spinner *ngIf="(isSendingMessage | async); else endWordTermine" [diameter]="24" [mode]="'indeterminate'">
                                    </mat-progress-spinner>
                                    <ng-template #endWordTermine>Envoyer</ng-template>
                                </button>
                            </div>
                        </div>
                    </mat-step>
                </mat-horizontal-stepper>
            </form>


    </div>

</div>
