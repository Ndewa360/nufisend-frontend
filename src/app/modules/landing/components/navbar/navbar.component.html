<header class="nufi-navbar fixed inset-x-0 top-0 z-50" [class.is-scrolled]="scrolled">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-8">
        <a routerLink="/home" class="flex shrink-0 items-center" aria-label="NufiSend - Accueil">
            <img src="assets/images/logo/nufisend-logo.png" alt="NufiSend" class="h-10 w-auto sm:h-11">
        </a>

        <nav class="hidden items-center gap-1 lg:flex" aria-label="Navigation principale">
            <a href="#features" class="nufi-nav-link">Fonctionnalités</a>
            <a href="#how-it-works" class="nufi-nav-link">Comment ça marche</a>
            <a href="#pricing" class="nufi-nav-link">Tarifs</a>
            <a href="#faq" class="nufi-nav-link">FAQ</a>
        </nav>

        <div class="hidden items-center gap-2 lg:flex">
            <a routerLink="/auth/sign-in" class="rounded-full px-4 py-2.5 text-[14px] font-semibold text-nufi-900 transition duration-300 hover:bg-nufi-50 hover:text-nufi-700">
                Se connecter
            </a>
            <a routerLink="/auth/sign-up" class="inline-flex items-center gap-2 rounded-full bg-nufi-600 px-5 py-2.5 text-[14px] font-bold text-white shadow-[0_12px_26px_-12px_rgba(5,136,86,0.6)] transition duration-300 hover:-translate-y-0.5 hover:bg-nufi-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-nufi-200">
                Créer un compte
                <mat-icon class="icon-size-4" svgIcon="heroicons_solid:arrow-right"></mat-icon>
            </a>
        </div>

        <button
            type="button"
            class="flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white/80 text-nufi-900 shadow-sm backdrop-blur transition hover:border-nufi-200 hover:bg-white focus:outline-none focus-visible:ring-4 focus-visible:ring-nufi-100 lg:hidden"
            [attr.aria-expanded]="showMenu"
            aria-controls="nufi-mobile-menu"
            aria-label="Ouvrir ou fermer le menu"
            (click)="toggleMenu()">
            <mat-icon class="icon-size-6" [svgIcon]="showMenu ? 'heroicons_solid:x' : 'heroicons_solid:menu'"></mat-icon>
        </button>
    </div>

    <div
        id="nufi-mobile-menu"
        *ngIf="showMenu"
        class="max-h-[calc(100vh-5rem)] overflow-y-auto border-t border-slate-100 bg-white/95 px-4 pb-6 pt-4 shadow-[0_24px_50px_-24px_rgba(3,37,46,0.35)] backdrop-blur-xl lg:hidden">
        <nav class="mx-auto flex max-w-7xl flex-col gap-1" aria-label="Navigation mobile">
            <a href="#features" class="nufi-mobile-link" (click)="closeMenu()">Fonctionnalités</a>
            <a href="#how-it-works" class="nufi-mobile-link" (click)="closeMenu()">Comment ça marche</a>
            <a href="#pricing" class="nufi-mobile-link" (click)="closeMenu()">Tarifs</a>
            <a href="#faq" class="nufi-mobile-link" (click)="closeMenu()">FAQ</a>
            <a href="mailto:contact@ndewa-360.com" class="nufi-mobile-link" (click)="closeMenu()">Contact</a>

            <div class="mt-4 grid gap-2 border-t border-slate-100 pt-4">
                <a routerLink="/auth/sign-in" class="flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-3 text-[14px] font-bold text-nufi-900 transition hover:bg-nufi-50" (click)="closeMenu()">
                    Se connecter
                </a>
                <a routerLink="/auth/sign-up" class="flex items-center justify-center gap-2 rounded-xl bg-nufi-600 px-5 py-3 text-[14px] font-bold text-white shadow-lg shadow-nufi-600/20 transition hover:bg-nufi-700" (click)="closeMenu()">
                    Créer un compte
                    <mat-icon class="icon-size-4" svgIcon="heroicons_solid:arrow-right"></mat-icon>
                </a>
            </div>
        </nav>
    </div>
</header>
