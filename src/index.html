<!doctype html>
<html lang="fr">
    <head>
        <title>NufiSend</title>
        <meta charset="utf-8">
        <meta
            name="description"
            content="NufiSend centralise votre communication WhatsApp : synchronisation des contacts, groupes de diffusion, modèles de messages et envois programmés.">
        <meta
            name="keywords"
            content="NufiSend, WhatsApp, communication, contacts, groupes de diffusion, messages programmés, campagnes WhatsApp">
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
        <meta name="theme-color" content="#058856">

        <base href="/">

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="assets/images/logo/nufisend_n-nobg.png">

        <!-- Fonts -->
        <link
            href="assets/fonts/inter/inter.css"
            rel="stylesheet">

        <link
            href="https://fonts.gstatic.com"
            rel="preconnect">
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet">

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">

        <!-- Splash screen styles -->
        <link
            href="assets/styles/splash-screen.css"
            rel="stylesheet">

    </head>

    <body>

        <!-- Splash screen -->
        <fuse-splash-screen>
            <img
                src="assets/images/logo/nufisend_n-nobg.png"
                alt="NufiSend logo">
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>

    </body>

</html>
